# ============================================================================
#  Multi AI Orchestrator - general settings
#  Every value is optional; anything missing falls back to a sensible default.
# ============================================================================

# Default workspace (the folder the agents are allowed to work in). Set it with /workspace <path>
workspace: null

# Language the agents write their plans, reports and summaries in
response_language: English

# Where sessions and logs are stored (relative to the program folder, or absolute)
logs_dir: logs

# Location of the encrypted API keys
# (null = %LOCALAPPDATA%\MultiAIOrchestrator\secrets.dat on Windows, ~/.config/mao/secrets.dat elsewhere)
secrets_file: null

# Short names for models: alias -> provider (its default model) or provider/model
aliases:
  gpt: openai
  chatgpt: openai
  gemini: gemini
  grok: xai
  claude: anthropic
  local: ollama
  llama: ollama

limits:
  max_tokens: 2000000          # total tokens per session               (/max-tokens)
  max_cost_usd: 5.0            # estimated cost per session in USD      (/max-cost)
  max_llm_calls: null          # optional: maximum number of model calls
  max_agents: 20               # maximum number of agent instances      (/max-agents)
  max_rounds: 3                # discussion rounds (debate/plan critique) (/max-rounds)
  max_parallel_agents: 4       # agents working at the same time        (/max-parallel)
  max_steps_per_task: 30       # tool steps per agent task
  max_fix_iterations: 3        # cycles of test -> debug -> fix
  max_review_iterations: 2     # cycles of review -> fix
  max_node_attempts: 2         # attempts per plan step (with a different agent)
  max_consultations_per_task: 3
  max_ram_percent: 92          # above this RAM usage, start no further steps in parallel
  on_limit: ask                # ask = ask what to do, stop = stop in a controlled way
  soft_limit_ratio: 0.8        # warn from 80 % on

context:
  compaction_threshold: 0.75       # compact the history from 75 % of the context window on
  max_tool_result_chars: 12000     # longer tool results are truncated
  max_shared_context_tokens: 12000 # budget for shared context per agent task
  default_max_output_tokens: 32000 # cap on output tokens per model call
  summary_model: auto              # model used for summaries (auto = cheap/fast)

orchestration:
  strategy: standard
  auto_model_selection: true   # false = every agent needs a fixed model
  model_policy: balanced       # quality | balanced | cheap
  orchestrator_model: auto     # model for triage, judge decisions and synthesis
  debate_enabled: true
  consensus_threshold: 0.67    # weighted share of approval needed for consensus
  investigation_max_agents: 4  # parallel investigations in PLAN mode
  max_critics: 3               # critics per plan/debate round
  auto_add_quality_gates: true # add test and review steps automatically
  require_plan_approval: true
  vote_weights:                # vote weight per role
    security: 1.3
    architect: 1.2
    reviewer: 1.1

privacy:
  local_only: false            # true = use local models only

ui:
  refresh_per_second: 4
  show_banner: true
  debug: false                 # /debug on|off
  max_event_lines: 10

logging:
  level: INFO
