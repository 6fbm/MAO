# ============================================================================
#  Roles
#
#  Built-in roles: planner, architect, researcher, coder, reviewer, tester,
#  debugger, security, critic, documentation, project_manager, performance
#
#  Define new roles here, or adjust the built-in ones.
#  When the name matches a built-in role, only the fields you give are overridden.
#
#  capabilities drive how work is distributed, for example:
#    planning, analysis, architecture, research, coding, review, testing,
#    debugging, security, critique, documentation, management, performance
# ============================================================================
roles: {}

